# Decap CMS settings — the editing screen at potayinite.org/admin
# Two lines below must be changed before sign-in works (see README, step 3).

backend:
  name: github
  repo: potayinite/potay-inite       # ← your GitHub username / repository name
  branch: main
  base_url: https://sveltia-cms-auth.sgp15.workers.dev  # ← your sign-in helper's address
  commit_messages:
    create: "Add {{collection}} “{{slug}}”"
    update: "Update {{collection}} “{{slug}}”"
    delete: "Delete {{collection}} “{{slug}}”"
    uploadMedia: "Upload “{{path}}”"
    deleteMedia: "Delete “{{path}}”"

locale: en          # language of the editing screen itself (en or fr)
site_url: https://potayinite.org
display_url: https://potayinite.org

media_folder: assets/uploads
public_folder: /assets/uploads

# Every piece of content has an English, French and Kreyòl version.
# English is the main one: anything left empty in French or Kreyòl shows the English text.
i18n:
  structure: multiple_folders
  locales: [en, fr, ht]
  default_locale: en

collections:

  # ─────────────── Blog ───────────────
  - name: blog
    label: Blog
    label_singular: Article
    description: "Articles for the blog (Our Pulse). Write the English version first, then switch to FR / HT at the top to translate."
    folder: _posts
    create: true
    i18n: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — {{year}}-{{month}}-{{day}}"
    sortable_fields: [date, title]
    fields:
      - { label: Title, name: title, widget: string, i18n: true }
      - { label: Publish date, name: date, widget: datetime, default: "{{now}}", time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD", i18n: duplicate }
      - { label: Category, name: category, widget: string, required: false, i18n: true }
      - { label: Author, name: author, widget: string, required: false, i18n: duplicate }
      - { label: Main image, name: image, widget: image, required: false, i18n: duplicate }
      - { label: Summary (1–2 sentences), name: summary, widget: text, required: false, i18n: true }
      - { label: Article, name: body, widget: markdown, i18n: true }

  # ─────────────── Events ───────────────
  - name: events
    label: Events
    label_singular: Event
    description: "Each event gets a card on the Events page and its own page. After the date passes it moves to 'Past events' by itself — then add photos and a video to its page."
    folder: _events
    create: true
    i18n: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: [date, title]
    fields:
      - { label: Event name, name: title, widget: string, i18n: true }
      - { label: Date, name: date, widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD", i18n: duplicate }
      - { label: "Time (optional, e.g. 6:00 – 9:00 PM)", name: time, widget: string, required: false, i18n: true }
      - { label: Location, name: location, widget: string, required: false, i18n: true }
      - { label: Card photo, name: image, widget: image, required: false, i18n: duplicate, hint: "Square photos look best. If empty, the first gallery photo is used." }
      - label: Button
        name: button
        widget: select
        required: false
        default: none
        i18n: duplicate
        options:
          - { label: No button, value: none }
          - { label: Buy Tickets, value: tickets }
          - { label: RSVP, value: rsvp }
          - { label: Register, value: register }
      - { label: Button link (ticket or RSVP page), name: button_link, widget: string, required: false, i18n: duplicate, hint: "Shown only while the event is upcoming." }
      - { label: "Details (shown on the event's page)", name: body, widget: markdown, required: false, i18n: true }
      - label: "Video — YouTube or Vimeo link (usually added after the event)"
        name: video
        widget: string
        required: false
        hint: "Paste the link from YouTube or Vimeo. Add it in English; all languages show it."
      - label: "Photo gallery (usually added after the event)"
        name: gallery
        widget: list
        required: false
        collapsed: false
        summary: "{{fields.caption}}"
        hint: "Add photos in English; all languages show them. Click a photo on the site to view it large."
        fields:
          - { label: Photo, name: image, widget: image }
          - { label: Caption (optional), name: caption, widget: string, required: false }

  # ─────────────── Pages ───────────────
  - name: pages
    label: Pages
    description: "The text and photos on each page of the site."
    editor: { preview: false }
    i18n:
      structure: single_file
    files:

      - name: home
        label: Home page
        file: _data/home.yml
        i18n: true
        fields:
          - label: "Top section (hero)"
            name: hero
            widget: object
            i18n: true
            fields:
              - { label: "Headline (press Enter for a new line)", name: headline, widget: text, i18n: true }
              - { label: Logo, name: logo, widget: image, required: false, i18n: duplicate }
              - { label: Logo description (for screen readers), name: logo_alt, widget: string, required: false, i18n: true }
              - { label: Introduction, name: intro, widget: text, i18n: true }
              - { label: Button text, name: button_label, widget: string, i18n: true }
              - { label: Button goes to, name: button_target, widget: select, default: blog, i18n: duplicate, options: [ { label: Blog, value: blog }, { label: About, value: about }, { label: Events, value: events }, { label: Contact, value: contact }, { label: Donate, value: donate }, { label: Join form, value: join } ] }
              - { label: Portrait photo, name: portrait, widget: image, i18n: duplicate }
              - { label: Portrait description (for screen readers), name: portrait_alt, widget: string, required: false, i18n: true }
              - { label: "Badge text on the photo (leave empty to hide)", name: badge_label, widget: string, required: false, i18n: true }
              - { label: Background landscape photo, name: background, widget: image, i18n: duplicate }
          - label: "Pillars (dark section)"
            name: pillars
            widget: object
            i18n: true
            fields:
              - { label: Title, name: title, widget: string, i18n: true }
              - { label: Introduction, name: intro, widget: text, i18n: true }
              - label: Pillar cards
                name: cards
                widget: list
                i18n: true
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: text }
              - { label: Button text, name: button_label, widget: string, i18n: true }
              - { label: Button goes to, name: button_target, widget: select, default: about, i18n: duplicate, options: [ { label: Blog, value: blog }, { label: About, value: about }, { label: Events, value: events }, { label: Contact, value: contact }, { label: Donate, value: donate }, { label: Join form, value: join } ] }
          - label: Educational pathways
            name: pathways
            widget: object
            i18n: true
            fields:
              - { label: Title, name: title, widget: string, i18n: true }
              - { label: Introduction, name: intro, widget: text, i18n: true }
              - label: "Pathway cards (numbered automatically)"
                name: items
                widget: list
                i18n: true
                hint: "Photos only need to be added in English — the other languages reuse them."
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: text }
                  - { label: Photo, name: image, widget: image, required: false }
              - { label: Button text, name: button_label, widget: string, i18n: true }
              - { label: Button goes to, name: button_target, widget: select, default: about, i18n: duplicate, options: [ { label: Blog, value: blog }, { label: About, value: about }, { label: Events, value: events }, { label: Contact, value: contact }, { label: Donate, value: donate }, { label: Join form, value: join } ] }
          - label: Community voices
            name: voices
            widget: object
            i18n: true
            fields:
              - { label: Title, name: title, widget: string, i18n: true }
              - { label: Main quote, name: featured_quote, widget: text, i18n: true }
              - { label: Main quote — who said it, name: featured_author, widget: string, i18n: true }
              - label: Other quotes
                name: quotes
                widget: list
                i18n: true
                fields:
                  - { label: Quote, name: quote, widget: text }
                  - { label: Who said it, name: author, widget: string }
          - label: Unity Network (partners)
            name: network
            widget: object
            i18n: true
            fields:
              - { label: Title, name: title, widget: string, i18n: true }
              - { label: Text, name: text, widget: text, i18n: true }
              - label: "Partner logos (edit in English — shared by all languages)"
                name: partners
                widget: list
                fields:
                  - { label: Partner name, name: name, widget: string }
                  - { label: Logo, name: logo, widget: image, required: false }
                  - { label: Website (optional), name: link, widget: string, required: false }
          - label: Join the movement (form section)
            name: join
            widget: object
            i18n: true
            fields:
              - { label: "Title (press Enter for a new line)", name: title, widget: text, i18n: true }
              - { label: Text, name: text, widget: text, i18n: true }
              - { label: Photo, name: image, widget: image, i18n: duplicate }
              - { label: Photo description (for screen readers), name: image_alt, widget: string, required: false, i18n: true }
              - { label: Form title, name: form_title, widget: string, i18n: true }

      - name: about
        label: About page
        file: _data/pages/about.yml
        i18n: true
        fields:
          - { label: Title, name: title, widget: string, i18n: true }
          - { label: Introduction, name: intro, widget: text, required: false, i18n: true }
          - { label: Photo, name: image, widget: image, required: false, i18n: duplicate }
          - { label: Photo description (for screen readers), name: image_alt, widget: string, required: false, i18n: true }
          - { label: Page text, name: body, widget: markdown, i18n: true }

      - name: events_page
        label: Events page (intro)
        file: _data/pages/events.yml
        i18n: true
        fields:
          - { label: Title, name: title, widget: string, i18n: true }
          - { label: Introduction, name: intro, widget: text, required: false, i18n: true }

      - name: blog_page
        label: Blog page (intro)
        file: _data/pages/blog.yml
        i18n: true
        fields:
          - { label: Title, name: title, widget: string, i18n: true }
          - { label: Introduction, name: intro, widget: text, required: false, i18n: true }

      - name: contact
        label: Contact page
        file: _data/pages/contact.yml
        i18n: true
        fields:
          - { label: Title, name: title, widget: string, i18n: true }
          - { label: Introduction, name: intro, widget: text, required: false, i18n: true }

      - name: donate
        label: Donate page
        file: _data/pages/donate.yml
        i18n: true
        fields:
          - { label: Title, name: title, widget: string, i18n: true }
          - { label: Introduction, name: intro, widget: text, required: false, i18n: true }
          - { label: Button text, name: button_label, widget: string, i18n: true }
          - { label: Page text, name: body, widget: markdown, i18n: true }

  # ─────────────── Site settings ───────────────
  - name: settings
    label: Site settings
    description: "Footer text, contact details, social links, donation link and form addresses."
    editor: { preview: false }
    i18n:
      structure: single_file
    files:
      - name: settings
        label: Footer, contact & links
        file: _data/settings.yml
        i18n: true
        fields:
          - { label: Name shown in the header and footer, name: wordmark, widget: string }
          - { label: Footer tagline, name: tagline, widget: string, i18n: true }
          - { label: Phone, name: phone, widget: string, required: false }
          - { label: Email, name: email, widget: string, required: false }
          - { label: Address, name: address, widget: text, required: false, i18n: true }
          - { label: Footer description, name: footer_about, widget: text, required: false, i18n: true }
          - { label: Newsletter text, name: newsletter_text, widget: text, required: false, i18n: true }
          - { label: Footer closing line, name: footer_note, widget: string, required: false, i18n: true }
          - { label: "Outside donation page (PayPal, Stripe…) — leave empty to use the site's Donate page", name: donate_url, widget: string, required: false }
          - { label: Join form address (Formspree), name: join_form_action, widget: string }
          - { label: Contact form address (Formspree), name: contact_form_action, widget: string }
          - { label: Newsletter form address (Formspree), name: newsletter_form_action, widget: string }
          - label: Social media links (leave a link empty to hide it)
            name: social
            widget: list
            fields:
              - { label: Network, name: name, widget: string }
              - { label: Link, name: url, widget: string, required: false }
